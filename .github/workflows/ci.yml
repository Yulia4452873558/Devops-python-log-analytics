name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Code Quality & Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup-python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check Python Syntax
        run: |
          python -m py_compile log_parser.py
          python -m py_compile api_server.py
          python -m py_compile telegram_alert.py

      - name: Log in to Docker Hub
        uses: Docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          username: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: yulia4452873558/devops-python-log-analytics:latest
