version: '3.8'

services:
  api:
    build: .
    container_name: python_log_api
    ports:
      - "5000:5000"
    restart: always

  webproxy:
    image: nginx:latest
    container_name: nginx_log_proxy
    ports:
      - "8085:80"
    volumes:
      - ./nginx_log_analytics.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always
